  <text x="114" y="170" class="mono" font-size="16" fill="#c9d1d9"># dbo.orders</text>

  <text x="114" y="210" class="mono" font-size="14" fill="#c9d1d9">## Purpose</text>
  <text x="114" y="232" class="mono" font-size="13" fill="#8b949e">Stores customer purchase orders, including order date, status, and totals.</text>

  <text x="114" y="276" class="mono" font-size="14" fill="#c9d1d9">## Columns</text>
  <text x="114" y="300" class="mono" font-size="13" fill="#c9d1d9">- order_id (int) — primary identifier</text>
  <text x="114" y="322" class="mono" font-size="13" fill="#c9d1d9">- customer_id (int) — links to dbo.customers</text>
  <text x="114" y="344" class="mono" font-size="13" fill="#c9d1d9">- order_date (datetime) — when the order was placed</text>
  <text x="114" y="366" class="mono" font-size="13" fill="#c9d1d9">- status (nvarchar) — lifecycle state (e.g., created/shipped/cancelled)</text>

  <text x="114" y="410" class="mono" font-size="14" fill="#c9d1d9">## Keys &amp; relationships</text>
  <text x="114" y="434" class="mono" font-size="13" fill="#c9d1d9">- PK: (order_id)</text>
  <text x="114" y="456" class="mono" font-size="13" fill="#c9d1d9">- FK: (customer_id) → dbo.customers(customer_id)</text>

  <text x="114" y="500" class="mono" font-size="14" fill="#c9d1d9">## Row count</text>
  <text x="114" y="522" class="mono" font-size="13" fill="#c9d1d9">~ 1,234 rows (sampled at generation time)</text>

  <text x="114" y="566" class="mono" font-size="14" fill="#c9d1d9">## Sample rows (top 5)</text>
  <text x="114" y="590" class="mono" font-size="12" fill="#8b949e">| order_id | customer_id | order_date           | status   |</text>
  <text x="114" y="610" class="mono" font-size="12" fill="#8b949e">|--------:|------------:|----------------------|----------|</text>
  <text x="114" y="630" class="mono" font-size="12" fill="#8b949e">| 10001   | 42          | 2026-04-01 09:15:00  | shipped  |</text>

  <!-- footer note -->
